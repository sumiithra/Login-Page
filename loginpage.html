<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExploreX Login</title>
    <link rel="stylesheet" href="./loginpage.css">
</head>
<body>
    <div class="container">
        <div class="img">
            <div class="welcontent">
                <span>Welcome Back</span>
                <h1>
                    Good to see<br>
                    you again!👋
                </h1>
                <p>
                    Login to continue your journey<br>
                    and explore more.
                </p>
            </div>
            <div class="quotecontent">
                <p>
                    “ <br>
                    Code. Create. Innovate.<br>
                    The future is built by you.
                </p>
            </div>
        </div>
        <div class="login-section">
            <div class="brand">
                <img 
                    src="https://static.vecteezy.com/system/resources/thumbnails/008/075/499/small/initial-letter-o-hexagon-logo-template-suitable-for-businesses-and-product-names-vector.jpg"
                    alt="ExploreX Logo">
                    <h2>TechNova</h2>
                    <p>Innovate. Integrate. Inspire.</p>
                    <h3>Login to your account</h3>
                </div>
                <div class="inputss">
                <label>Username or Email</label>
                <input type="text" placeholder="Enter your username or email">
            </div>
            <div class="inputss">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            <div class="options">
                <label>
                    <input type="checkbox">Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button class="login-btn">Login</button>
                <div class="divider">
                    <span></span>
                    <p>or continue with</p>
                    <span></span>
                </div>
                <div class="loginbtn">
                    <button>Google</button>
                    <button>GitHub</button>
                </div>
                <p class="signup">Don't have an account?<a href="#">Sign up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
